name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies (opencv / numpy / flask / pymodbus)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check (compileall)
        run: python -m compileall -q config.py part_model.py vision_pipeline.py run_batch.py calib detect locate plc_link simulator tools tests dashboard

      - name: Unit tests (52 unittest cases incl. doc consistency self-check)
        run: python -m unittest discover tests -v
